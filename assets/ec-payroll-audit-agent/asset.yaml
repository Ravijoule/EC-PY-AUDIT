apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: ec-payroll-audit-agent
  description: Generates a consolidated EC Payroll infotypes changes audit report for the current month, categorized by P2P EC-to-ECP, Inbound, and Manual updates, with before/after values for the top 100 highest-salaried employees.
  version: "1.0.0"

provides:
  apis:
    - name: ec-payroll-audit-agent
      kind: a2a
      ordId: customer.build:apiResource:ec-payroll-audit-6d7a7.ec-payroll-audit-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
